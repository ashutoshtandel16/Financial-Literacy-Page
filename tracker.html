<!-- CONTENT -->

<div class="container my-5">

    <h1 class="text-center mb-4">
        Expense Tracker
    </h1>


    <div class="text-center mb-5">

        <img
            src="tracker-expense-management.jpg"
            alt="Expense management"
            class="img-fluid page-image"
        >

    </div>


    <div class="row g-4">


        <!-- FORM -->

        <div class="col-md-5">

            <div class="card p-4">

                <h3>
                    Add Expense
                </h3>


                <div class="mb-3">

                    <label class="form-label">
                        Expense Name
                    </label>

                    <input
                        type="text"
                        id="expenseName"
                        class="form-control"
                        placeholder="Example: Lunch"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        id="expenseCategory"
                        class="form-select"
                    >

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="expenseAmount"
                        class="form-control"
                        placeholder="Enter amount"
                        min="0"
                    >

                </div>


                <button
                    class="btn btn-primary"
                    onclick="addExpense()"
                >
                    Add Expense
                </button>

            </div>

        </div>


        <!-- EXPENSE LIST -->

        <div class="col-md-7">

            <div class="card p-4">

                <h3>
                    My Expenses
                </h3>


                <div id="expenseList"></div>


                <hr>


                <h4>
                    Total:
                    ₹<span id="totalExpense">0</span>
                </h4>

            </div>

        </div>


    </div>


    <!-- CHART -->

    <div class="card p-4 mt-4">

        <h3 class="text-center">
            Expense Breakdown
        </h3>


        <div class="chart-container">

            <canvas id="expenseChart"></canvas>

        </div>

    </div>

</div>
