<!-- CONTENT -->

<div class="container my-5">

    <h1 class="text-center mb-4">
        Financial Tools
    </h1>


    <div class="text-center mb-5">

        <img
            src="tools-financial-calculators.jpg"
            alt="Financial calculators"
            class="img-fluid page-image"
        >

    </div>


    <div class="row g-4">


        <!-- SAVINGS CALCULATOR -->

        <div class="col-md-6">

            <div class="card p-4 h-100">

                <h3>
                    💰 Savings Calculator
                </h3>


                <div class="mb-3">

                    <label class="form-label">
                        Monthly Income
                    </label>

                    <input
                        type="number"
                        id="income"
                        class="form-control"
                        placeholder="Enter income"
                        min="0"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Monthly Expenses
                    </label>

                    <input
                        type="number"
                        id="expenses"
                        class="form-control"
                        placeholder="Enter expenses"
                        min="0"
                    >

                </div>


                <button
                    class="btn btn-primary"
                    onclick="calculateSavings()"
                >
                    Calculate
                </button>


                <div
                    id="savingsResult"
                    class="alert alert-success mt-3"
                >
                    Your result will appear here.
                </div>

            </div>

        </div>


        <!-- EMI CALCULATOR -->

        <div class="col-md-6">

            <div class="card p-4 h-100">

                <h3>
                    🏦 EMI Calculator
                </h3>


                <div class="mb-3">

                    <label class="form-label">
                        Loan Amount
                    </label>

                    <input
                        type="number"
                        id="loanAmount"
                        class="form-control"
                        placeholder="Enter loan amount"
                        min="0"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Annual Interest Rate (%)
                    </label>

                    <input
                        type="number"
                        id="interestRate"
                        class="form-control"
                        placeholder="Enter interest rate"
                        min="0"
                        step="0.01"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Loan Tenure (Years)
                    </label>

                    <input
                        type="number"
                        id="loanYears"
                        class="form-control"
                        placeholder="Enter years"
                        min="1"
                    >

                </div>


                <button
                    class="btn btn-primary"
                    onclick="calculateEMI()"
                >
                    Calculate
                </button>


                <div
                    id="emiResult"
                    class="alert alert-success mt-3"
                >
                    Your result will appear here.
                </div>

            </div>

        </div>


    </div>
