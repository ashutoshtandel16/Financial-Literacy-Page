<!-- MAIN CONTENT -->

<div class="container my-5">

    <h1 class="text-center">
        Currency Converter
    </h1>

    <p class="text-center text-muted mb-4">
        Convert currencies using current exchange rates.
    </p>


    <!-- CURRENCY CONVERTER -->

    <div class="card p-4 mx-auto mb-5" style="max-width: 800px;">

        <div class="row g-3 align-items-end">

            <!-- AMOUNT -->

            <div class="col-md-4">

                <label for="amount" class="form-label">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    class="form-control"
                    placeholder="Enter amount"
                    min="0"
                    step="any"
                >

            </div>


            <!-- FROM CURRENCY -->

            <div class="col-md-3">

                <label for="fromCurrency" class="form-label">
                    From
                </label>

                <select id="fromCurrency" class="form-select">

                    <option value="INR">INR - Indian Rupee</option>
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="AED">AED - UAE Dirham</option>
                    <option value="JPY">JPY - Japanese Yen</option>

                </select>

            </div>


            <!-- TO CURRENCY -->

            <div class="col-md-3">

                <label for="toCurrency" class="form-label">
                    To
                </label>

                <select id="toCurrency" class="form-select">

                    <option value="USD">USD - US Dollar</option>
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="AED">AED - UAE Dirham</option>
                    <option value="JPY">JPY - Japanese Yen</option>

                </select>

            </div>


            <!-- CONVERT BUTTON -->

            <div class="col-md-2">

                <button
                    class="btn btn-primary w-100"
                    onclick="convertCurrency()"
                >
                    Convert
                </button>

            </div>

        </div>


        <!-- VALIDATION / ERROR -->

        <div
            id="converterError"
            class="alert alert-danger mt-3"
            style="display: none;"
        >
        </div>


        <!-- RESULT -->

        <div
            id="conversionResult"
            class="alert alert-success mt-3 text-center"
            style="display: none;"
        >
        </div>

    </div>


    <!-- LIVE RATES -->

    <h2 class="text-center">
        Live Currency Rates
    </h2>

    <p class="text-center text-muted">
        Current exchange rates fetched from a REST API.
    </p>


    <!-- REFRESH BUTTON -->

    <div class="text-center my-4">

        <button
            class="btn btn-primary"
            onclick="getCurrencyRates()"
        >
            🔄 Refresh Rates
        </button>

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="text-center"
    >
        Loading currency rates...
    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="alert alert-danger text-center"
        style="display: none;"
    >
    </div>


    <!-- CURRENCY CARDS -->

    <div
        id="currencyContainer"
        class="row g-4"
    >
    </div>

</div>


<!-- FOOTER -->

<footer class="bg-dark text-white text-center p-3">

    <p class="mb-0">

    </p>
