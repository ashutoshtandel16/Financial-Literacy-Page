<div class="container my-5">


    <h1 class="text-center">
        Live Currency Data
    </h1>


    <p class="text-center text-muted mb-4">

        Convert currencies and view the latest
        exchange rates.

    </p>


    <div class="text-center mb-5">

        <img
            src="live-currency-exchange.jpg"
            alt="Currency exchange"
            class="img-fluid page-image"
        >

    </div>


    <!-- CURRENCY CONVERTER -->

    <div
        class="card p-4 mx-auto mb-5"
        style="max-width: 850px;"
    >

        <h2 class="text-center mb-4">
            💱 Currency Converter
        </h2>


        <div class="row g-3 align-items-end">


            <div class="col-md-4">

                <label
                    for="amount"
                    class="form-label"
                >
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    class="form-control"
                    placeholder="Enter amount"
                    min="0"
                    step="any"
                >

            </div>


            <div class="col-md-3">

                <label
                    for="fromCurrency"
                    class="form-label"
                >
                    From
                </label>

                <select
                    id="fromCurrency"
                    class="form-select"
                >

                    <option value="INR">
                        INR - Indian Rupee
                    </option>

                    <option value="USD">
                        USD - US Dollar
                    </option>

                    <option value="EUR">
                        EUR - Euro
                    </option>

                    <option value="GBP">
                        GBP - British Pound
                    </option>

                    <option value="AED">
                        AED - UAE Dirham
                    </option>

                    <option value="JPY">
                        JPY - Japanese Yen
                    </option>

                </select>

            </div>


            <div class="col-md-3">

                <label
                    for="toCurrency"
                    class="form-label"
                >
                    To
                </label>

                <select
                    id="toCurrency"
                    class="form-select"
                >

                    <option value="USD">
                        USD - US Dollar
                    </option>

                    <option value="INR">
                        INR - Indian Rupee
                    </option>

                    <option value="EUR">
                        EUR - Euro
                    </option>

                    <option value="GBP">
                        GBP - British Pound
                    </option>

                    <option value="AED">
                        AED - UAE Dirham
                    </option>

                    <option value="JPY">
                        JPY - Japanese Yen
                    </option>

                </select>

            </div>


            <div class="col-md-2">

                <button
                    class="btn btn-primary w-100"
                    onclick="convertCurrency()"
                >
                    Convert
                </button>

            </div>


        </div>


        <div
            id="converterError"
            class="alert alert-danger mt-3"
            style="display: none;"
        >
        </div>


        <div
            id="conversionResult"
            class="alert alert-success mt-3 text-center"
            style="display: none;"
        >
        </div>

    </div>


    <!-- CURRENT RATES -->

    <div class="text-center">

        <h2>
            Current Exchange Rates
        </h2>

        <p class="text-muted">

            Latest available exchange rates.

        </p>


        <button
            class="btn btn-primary my-3"
            onclick="getCurrencyRates()"
        >
            🔄 Refresh Rates
        </button>

    </div>


    <div
        id="loading"
        class="text-center my-3"
    >
        Loading currency rates...
    </div>


    <div
        id="error"
        class="alert alert-danger text-center"
        style="display: none;"
    >
    </div>


    <div
        id="currencyContainer"
        class="row g-4"
    >
    </div>


</div>

    <p class="mb-0">

    </p>

</footer>
